name: Deploy KHELOGO Firebase Functions

on:
  push:
    branches: ["main"]
    paths:
      - "functions/**"
      - "firebase.json"
      - ".firebaserc"
      - ".github/workflows/deploy-firebase.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Validate Functions JavaScript
        run: node --check functions/index.js
      - name: Install Functions dependencies
        working-directory: functions
        run: npm ci
      - name: Deploy Firebase Functions
        uses: w9jds/firebase-action@v13.24.0
        with:
          args: deploy --only functions --project khelogo-4daaf
        env:
          GCP_SA_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KHELOGO_4DAAF }}
