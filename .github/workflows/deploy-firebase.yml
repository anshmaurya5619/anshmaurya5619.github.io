name: Deploy KHELOGO Firebase Functions

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Validate Functions JavaScript
        run: node --check functions/index.js
      - name: Install Functions dependencies
        working-directory: functions
        run: npm install
      - name: Check Firebase deployment credentials
        env:
          GCP_SA_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KHELOGO_4DAAF }}
        run: |
          if [ -z "$GCP_SA_KEY" ]; then
            echo "::error::Missing GitHub Actions secret FIREBASE_SERVICE_ACCOUNT_KHELOGO_4DAAF. Add a Firebase service-account JSON key under Repository Settings > Secrets and variables > Actions, then rerun this workflow."
            exit 1
          fi
      - name: Deploy Firebase Functions
        uses: w9jds/firebase-action@v13.24.0
        with:
          args: deploy --only functions --project khelogo-4daaf
        env:
          GCP_SA_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KHELOGO_4DAAF }}
